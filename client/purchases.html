<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchases — Hisaab Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="app-layout">
        <div id="sidebar-overlay" class="sidebar-overlay"></div>
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="logo-icon-wrapper-sm">
                        <i data-lucide="book-open"></i>
                    </div>
                    <div><h1>Hisaab Pro</h1><small id="sidebar-shop-name">Business Ledger</small></div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section-title">Main</div>
                <a href="/dashboard.html" class="nav-link" data-page="dashboard">
                    <span class="nav-icon"><i data-lucide="layout-dashboard"></i></span> Dashboard
                </a>
                <a href="sales.html" class="nav-link" data-page="sales">
                    <span class="nav-icon"><i data-lucide="shopping-cart"></i></span> Sales
                </a>
                <a href="purchases.html" class="nav-link active" data-page="purchases">
                    <span class="nav-icon"><i data-lucide="shopping-bag"></i></span> Purchases
                </a>
                <a href="/payments.html" class="nav-link" data-page="payments">
                    <span class="nav-icon"><i data-lucide="indian-rupee"></i></span> Payments
                </a>
                <a href="/accounts.html" class="nav-link" data-page="accounts">
                    <span class="nav-icon"><i data-lucide="users"></i></span> Accounts
                </a>
                <div class="nav-section-title">Analysis</div>
                <a href="/reports.html" class="nav-link" data-page="reports">
                    <span class="nav-icon"><i data-lucide="bar-chart-3"></i></span> Reports
                </a>
                <div class="nav-section-title">System</div>
                <a href="/settings.html" class="nav-link" data-page="settings">
                    <span class="nav-icon"><i data-lucide="settings"></i></span> Settings
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="shop-info">
                    <div class="shop-name" id="footer-shop-name">Loading...</div>
                    <div class="user-role">Administrator</div>
                </div>
                <button class="btn-logout" onclick="logout()" title="Logout">
                    <i data-lucide="log-out"></i>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div style="display:flex;align-items:center;gap:12px;">
                    <button id="sidebar-toggle" class="sidebar-toggle">☰</button>
                    <h2 class="page-title">Purchases</h2>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" id="btn-new-purchase">+ New Purchase</button>
                </div>
            </header>

            <div class="page-content">
                <!-- Filters -->
                <div class="panel">
                    <div class="panel-body">
                        <div class="toolbar">
                            <div class="search-box">
                                <i data-lucide="search"></i>
                                <input type="text" class="form-control" id="search-input" placeholder="Search bill no or supplier...">
                            </div>
                            <div class="filter-group">
                                <input type="date" class="form-control" id="filter-date-from">
                                <input type="date" class="form-control" id="filter-date-to">
                                <select class="form-control" id="filter-status">
                                    <option value="">All Status</option>
                                    <option value="paid">Paid</option>
                                    <option value="partial">Partial</option>
                                    <option value="pending">Pending</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Purchases Table -->
                <div class="panel">
                    <div class="panel-body" id="purchases-list">
                        <div class="loading-state">
                            <p>Loading purchases...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Purchase Modal -->
    <div class="modal-overlay" id="purchase-modal">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <h3 id="purchase-modal-title">New Purchase</h3>
                <button class="modal-close" onclick="closePurchaseModal()">✕</button>
            </div>
            <div class="modal-body">
                <form id="purchase-form">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
                        <div class="form-group">
                            <label class="form-label">Bill/Invoice No *</label>
                            <input type="text" class="form-control" id="purchase-invoice-no" required placeholder="Supplier Bill No">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Date *</label>
                            <input type="date" class="form-control" id="purchase-date" required>
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom: 16px;">
                        <label class="form-label">Supplier Account *</label>
                        <select class="form-control" id="purchase-supplier" required>
                            <option value="">-- Select Supplier --</option>
                        </select>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
                        <div class="form-group">
                            <label class="form-label">Total Amount (₹) *</label>
                            <input type="number" class="form-control" id="purchase-total" step="0.01" required placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Book Ref No</label>
                            <input type="text" class="form-control" id="purchase-ref-no" placeholder="e.g. 01-01">
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom: 16px;">
                        <label class="form-label">Amount Paid (₹)</label>
                        <input type="number" class="form-control" id="purchase-amount-paid" step="0.01" value="0">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Notes</label>
                        <textarea class="form-control" id="purchase-notes" rows="2" placeholder="Optional notes..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closePurchaseModal()">Cancel</button>
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-danger" id="btn-delete-purchase" style="display:none;"><i data-lucide="trash-2"></i> Delete (Del/F8)</button>
                    <button class="btn btn-primary" id="btn-save-purchase">Save Purchase (F2)</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/shortcuts.js"></script>
    <script src="js/purchases.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
