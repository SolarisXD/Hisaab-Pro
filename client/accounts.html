<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts — Hisaab Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="app-layout">
        <div id="sidebar-overlay" class="sidebar-overlay"></div>
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="logo-icon-wrapper-sm">
                        <i data-lucide="book-open"></i>
                    </div>
                    <div><h1>Hisaab Pro</h1><small id="sidebar-shop-name">Business Ledger</small></div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section-title">Main</div>
                <a href="/dashboard.html" class="nav-link" data-page="dashboard">
                    <span class="nav-icon"><i data-lucide="layout-dashboard"></i></span> Dashboard
                </a>
                <a href="sales.html" class="nav-link" data-page="sales">
                    <span class="nav-icon"><i data-lucide="shopping-cart"></i></span> Sales
                </a>
                <a href="purchases.html" class="nav-link" data-page="purchases">
                    <span class="nav-icon"><i data-lucide="shopping-bag"></i></span> Purchases
                </a>
                <a href="/payments.html" class="nav-link" data-page="payments">
                    <span class="nav-icon"><i data-lucide="indian-rupee"></i></span> Payments
                </a>
                <a href="/accounts.html" class="nav-link active" data-page="accounts">
                    <span class="nav-icon"><i data-lucide="users"></i></span> Accounts
                </a>
                <div class="nav-section-title">Analysis</div>
                <a href="/reports.html" class="nav-link" data-page="reports">
                    <span class="nav-icon"><i data-lucide="bar-chart-3"></i></span> Reports
                </a>
                <div class="nav-section-title">System</div>
                <a href="/settings.html" class="nav-link" data-page="settings">
                    <span class="nav-icon"><i data-lucide="settings"></i></span> Settings
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="shop-info">
                    <div class="shop-name" id="footer-shop-name">Loading...</div>
                    <div class="user-role">Administrator</div>
                </div>
                <button class="btn-logout" onclick="logout()" title="Logout">
                    <i data-lucide="log-out"></i>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div style="display:flex;align-items:center;gap:12px;">
                    <button id="sidebar-toggle" class="sidebar-toggle">☰</button>
                    <h2 class="page-title">Accounts</h2>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" id="btn-new-account">+ New Account</button>
                </div>
            </header>

            <div class="page-content">
                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab active" onclick="filterAccounts(this, '')">All</button>
                    <button class="tab" onclick="filterAccounts(this, 'customer')">👤 Customers</button>
                    <button class="tab" onclick="filterAccounts(this, 'supplier')">🏭 Suppliers</button>
                    <button class="tab" onclick="filterAccounts(this, 'cash')"><i data-lucide="banknote" style="width:14px; height:14px;"></i> Cash</button>
                    <button class="tab" onclick="filterAccounts(this, 'bank')"><i data-lucide="landmark" style="width:14px; height:14px;"></i> Bank</button>
                </div>

                <!-- Search -->
                <div class="panel">
                    <div class="panel-body">
                        <div class="search-box" style="max-width:100%;">
                            <span class="search-icon">🔍</span>
                            <input type="text" id="search-input" placeholder="Search accounts by name or phone...">
                        </div>
                    </div>
                </div>

                <!-- Accounts List -->
                <div class="panel">
                    <div class="panel-body" id="accounts-list">
                        <div class="loading-overlay"><div class="spinner lg"></div></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- New Account Modal -->
    <div class="modal-overlay" id="account-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="account-modal-title">New Account</h3>
                <button class="modal-close" onclick="closeAccountModal()">✕</button>
            </div>
            <div class="modal-body">
                <form id="account-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Name <span class="required">*</span></label>
                            <input type="text" class="form-control" id="account-name" required placeholder="Account name">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Type <span class="required">*</span></label>
                            <select class="form-control" id="account-type" required>
                                <option value="customer">Customer (Debtor)</option>
                                <option value="supplier">Supplier (Creditor)</option>
                                <option value="cash">Cash</option>
                                <option value="bank">Bank</option>
                                <option value="expense">Expense</option>
                                <option value="revenue">Revenue</option>
                            </select>
                        </div>
                    </div>
                    <!-- Removed redundant Account Group field as per user request -->

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" id="account-phone" placeholder="10-digit number">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Opening Balance (₹)</label>
                            <input type="number" class="form-control" id="account-balance" step="0.01" value="0" placeholder="0.00">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Address</label>
                        <input type="text" class="form-control" id="account-address" placeholder="Address">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Notes</label>
                        <textarea class="form-control" id="account-notes" rows="2" placeholder="Optional notes"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeAccountModal()">Cancel</button>
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-danger" id="btn-delete-account" style="display:none;"><i data-lucide="trash-2"></i> Delete (Del/F8)</button>
                    <button class="btn btn-primary" id="btn-save-account">Save Account (F2)</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/shortcuts.js"></script>
    <script src="js/accounts.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
